*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;

#site-gate{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:20px}
.site-gate-card{width:100%;padding:36px 30px 28px;background:#fff;border:1px solid #e5e6eb;

.site-gate-lock{width:52px;height:52px;margin:0 auto 18px;display:flex;align-items:center;

.site-gate-title{margin:0 0 8px;font-size:1.35rem;font-weight:700;letter-spacing:.02em}
.site-gate-desc{margin:0 0 24px;font-size:.9rem;color:#86909c;line-height:1.6}

.site-gate-error{min-height:20px;margin:12px 0 0;font-size:13px;color:#f53f3f}

.site-gate-beian a:hover{border-color:#425aef;background:#425aef;color:#fff}
.site-gate-beian a::before{content:"";width:.48rem;height:.48rem;border-radius:50%;background:#425aef;

.site-gate-beian a:hover::before{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.22)}
.site-gate-beian a span{display:inline}
.site-gate-noscript{max-width:420px;margin:0;font-size:.85rem;color:#86909c;text-align:center}

  'use strict'

  var PAYLOAD_ID = 'site-gate-payload'
  var NS = 'site-unlock-v1'

  var node = document.getElementById(PAYLOAD_ID)
  var gate = document.getElementById('site-gate')
  var form = document.getElementById('site-gate-form')
  var input = document.getElementById('site-gate-input')
  var button = document.getElementById('site-gate-button')
  var errorBox = document.getElementById('site-gate-error')

  if (!node || !gate) return

  var cfg
  try {
    cfg = JSON.parse(node.textContent)
  } catch (err) {
    return
  }

  var subtle = window.crypto && (window.crypto.subtle || window.crypto.webkitSubtle)
  var storageKey = NS + ':' + cfg.s

  function showGate (message) {
    gate.style.display = 'flex'
    if (message && errorBox) errorBox.textContent = message
    if (input) {
      input.focus()
      if (input.value) input.select()
    }
  }

  function busy (state) {
    if (!button) return
    button.disabled = state
    button.textContent = state ? '解密中…' : '进入'
  }

  function b64ToBytes (b64) {
    var bin = atob(b64)
    var out = new Uint8Array(bin.length)
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i)
    return out
  }

  function bytesToB64 (bytes) {
    var view = new Uint8Array(bytes)
    var str = ''
    for (var i = 0; i < view.length; i++) str += String.fromCharCode(view[i])
    return btoa(str)
  }

  if (!subtle) {
    showGate('当前浏览器不支持解密，请改用现代浏览器打开。')
    return
  }

  var salt, iv, payload
  try {
    salt = b64ToBytes(cfg.s)
    iv = b64ToBytes(cfg.i)
    payload = b64ToBytes(cfg.c)
  } catch (err) {
    showGate('页面数据已损坏，无法解密。')
    return
  }

  function deriveKey (password) {
    return subtle
      .importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: cfg.n, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          true, // 需要导出原始密钥以便跨页面缓存
          ['decrypt']
        )
      })
  }

  function decryptWith (key) {
    return subtle
      .decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, key, payload)
      .then(function (plain) {
        return new TextDecoder().decode(plain)
      })
  }

  /**
   * 解锁后注入到真实页面的 fetch 拦截器：local_search 会去取 /search.json，
   * 而那个文件也是加密的，这里透明解密，搜索功能照常可用。
   */
  function searchShim () {
    var keyB64 = window.__siteUnlockKey
    if (!keyB64 || !window.fetch) return

    var nativeFetch = window.fetch.bind(window)
    var keyPromise = null

    function b64ToBytes (b64) {
      var bin = atob(b64)
      var out = new Uint8Array(bin.length)
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i)
      return out
    }

    function getKey () {
      if (!keyPromise) {
        keyPromise = crypto.subtle.importKey('raw', b64ToBytes(keyB64), { name: 'AES-GCM' }, false, ['decrypt'])
      }
      return keyPromise
    }

    var JSON_HEADERS = { 'Content-Type': 'application/json; charset=utf-8' }

    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : ((input && input.url) || '')
      var isSearchIndex = /search\.json(\?|#|$)/.test(url)

      return nativeFetch(input, init).then(function (response) {
        if (!isSearchIndex || !response.ok) return response

        return response.text().then(function (text) {
          var env
          try {
            env = JSON.parse(text)
          } catch (err) {
            return new Response(text, { status: response.status, headers: JSON_HEADERS })
          }
          if (!env || env.v !== 1 || !env.c || !env.i) {
            return new Response(text, { status: response.status, headers: JSON_HEADERS })
          }
          return getKey()
            .then(function (key) {
              return crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: b64ToBytes(env.i), tagLength: 128 },
                key,
                b64ToBytes(env.c)
              )
            })
            .then(function (plain) {
              return new Response(new TextDecoder().decode(plain), { status: 200, headers: JSON_HEADERS })
            })
        })
      })
    }
  }

  function render (html, keyB64) {
    var injected = '<script>window.__siteUnlockKey=' + JSON.stringify(keyB64) + ';(' +
      searchShim.toString() + ')();<\/script>'

    var patched = html.replace(/<head([^>]*)>/i, function (match, attrs) {
      return '<head' + attrs + '>' + injected
    })
    if (patched === html) patched = injected + html

    function write () {
      document.open()
      document.write(patched)
      document.close()
    }

    // 关键：解析期间 document.open() 是空操作（脚本嵌套层级 > 0），
    // 此时 write 会变成「追加」而不是「替换」，导致解锁页的 DOM 残留、
    // 真实页面的 <head> 被丢弃（样式全丢）。所以必须等解析结束再整篇替换。

      document.addEventListener('DOMContentLoaded', write, { once: true })
    } else {
      write()
    }
  }

  try { cached = localStorage.getItem(storageKey) } catch (err) { cached = null }

  if (cached) {
    subtle
      .importKey('raw', b64ToBytes(cached), { name: 'AES-GCM' }, false, ['decrypt'])
      .then(function (key) { return decryptWith(key) })
      .then(function (html) { render(html, cached) })
      .catch(function () {
        try { localStorage.removeItem(storageKey) } catch (err) { /* 忽略 */ }
        showGate('')
      })
  } else {
    showGate('')
  }

    form.addEventListener('submit', function (event) {
      event.preventDefault()

          return decryptWith(pair.key).then(function (html) {
            try { localStorage.setItem(storageKey, pair.b64) } catch (err) { /* 忽略 */ }

          })
        })
        .catch(function () {
          busy(false)
          showGate('密码错误，请重试。')
        })
    })
